# Telegram receiver for the YouTube digest. Deploy with: npm run worker:deploy
name = "yt-digest-bot"
main = "index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AI_MODEL = "claude-opus-5-5"
GITHUB_REPO = "devBamidele/yt-digest"
BOT_USERNAME = "dele_yt_digest_bot"

# Every 5 minutes: start the GitHub run for anyone whose delivery time has come.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (set with `npx wrangler secret put NAME`, never committed):
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, ANTHROPIC_API_KEY, WEBHOOK_SECRET, EVENTS_TOKEN,
# GOOGLE_WEB_CLIENT_ID, GOOGLE_WEB_CLIENT_SECRET, YOUTUBE_API_KEY, GH_DISPATCH_TOKEN

# Per-user data (v3). Created with: npx wrangler d1 create yt_digest
[[d1_databases]]
binding = "DB"
database_name = "yt_digest"
database_id = "efde78cb-07df-4cef-82a7-ffc967c6d464"

# Keep request logs (errors, CPU limits, console output) viewable in the Cloudflare dashboard.
[observability]
enabled = true
